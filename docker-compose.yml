version: "3.9"

# ─────────────────────────────────────────────────────────────
# AvertCare · Multi-Container Orchestration
# Services: backend · frontend · qdrant · redis · prometheus · grafana
# ─────────────────────────────────────────────────────────────

services:

  # ── FastAPI Inference & API Gateway ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avertcare-backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./ml_engine/models:/app/models:ro
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Next.js Clinical Dashboard ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avertcare-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - avertcare-net
    restart: unless-stopped

  # ── Qdrant Vector DB (RAG Engine) ───────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: avertcare-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - avertcare-net
    restart: unless-stopped

  # ── Redis (Caching + Rate Limiting) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: avertcare-redis
    ports:
      - "6379:6379"
    networks:
      - avertcare-net
    restart: unless-stopped

  # ── Prometheus (Metrics Scraper) ─────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: avertcare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - avertcare-net
    restart: unless-stopped

  # ── Grafana (IT Ops Dashboard) ───────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: avertcare-grafana
    ports:
      - "3001:3000"   # Grafana on :3001 to avoid clash with Next.js
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=avertcare
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - avertcare-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────
volumes:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  avertcare-net:
    driver: bridge

## ─────────────────────────────────────────────────────────────────────────────
## AvertCare · Universal Docker Compose
## All 7 services share one bridge network (avertcare-net).
## Pull develop → docker compose up --build → everything works.
##
## Ports (host → container)
##   Frontend   : 3000 → 3000   (Next.js dashboard)
##   Backend    : 8000 → 8000   (FastAPI + ML inference)
##   Qdrant     : 6333 → 6333   (Vector DB HTTP)
##              : 6334 → 6334   (Vector DB gRPC)
##   Redis      : 6379 → 6379   (Cache + rate-limit)
##   Prometheus : 9090 → 9090   (Metrics)
##   Grafana    : 3001 → 3000   (Ops dashboard)
## ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Inference & API Gateway ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: avertcare-backend:latest
    container_name: avertcare-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs with Docker-internal service names
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Models are mounted read-only from the committed backend/models directory.
      # Every developer gets the same trained artifacts after git pull.
      - ./backend/models:/app/models:ro
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s

  # ── Next.js Clinical Dashboard ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: avertcare-frontend:latest
    container_name: avertcare-frontend
    ports:
      - "3000:3000"
    environment:
      # The API is accessed from the *browser*, so it must use localhost, not
      # the Docker service name. This is correct for local dev.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Qdrant Vector DB (RAG Engine) ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: avertcare-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Redis (Caching + Rate Limiting) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: avertcare-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Prometheus (Metrics Scraper) ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: avertcare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - avertcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Grafana (IT Ops Dashboard) ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: avertcare-grafana
    ports:
      - "3001:3000"   # :3001 on host to avoid clash with Next.js on :3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=avertcare
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID=avertcare-mlops
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - avertcare-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  avertcare-net:
    driver: bridge
